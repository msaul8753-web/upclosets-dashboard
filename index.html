<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Up Closets · Dashboard</title>
  <link rel="icon" href="assets/logo-dark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sign in -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <img src="assets/logo-dark.png" alt="Up Closets" class="login-logo" />
      <h1>Rhode Island Dashboard</h1>
      <form id="login-form">
        <label>Email<input type="email" id="login-email" required autocomplete="username" /></label>
        <label>Password<input type="password" id="login-password" required minlength="8" autocomplete="current-password" /></label>
        <button class="btn primary" type="submit">Sign in</button>
        <button class="btn ghost" type="button" id="signup-btn">First time? Create my login</button>
        <p id="login-msg" class="muted small"></p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="assets/logo-dark.png" alt="Up Closets" /></div>
      <button class="btn primary create" id="create-lead-btn"><span>＋</span> New lead</button>
      <nav id="nav"></nav>
      <div class="sync" id="sync-status"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menu-btn" aria-label="Menu">☰</button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <input class="search" id="global-search" placeholder="Search clients, jobs, leads…" />
        <button class="icon-btn" id="refresh-btn" title="Reload data">⟳</button>
        <div class="user" id="user-chip"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="drawer" class="drawer hidden" aria-hidden="true"><div class="drawer-panel" id="drawer-panel"></div></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
